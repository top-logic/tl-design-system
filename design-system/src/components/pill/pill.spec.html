<!doctype html>
<html lang="de" data-tl-mode="light" data-tl-density="normal">
<head>
<meta charset="utf-8">
<title>TopLogic Design System — Pill</title>
<link rel="stylesheet" href="/fonts/style/interFonts.css">
<link rel="stylesheet" href="/dist/primitives.css">
<link rel="stylesheet" href="/dist/tokens.css">
<link rel="stylesheet" href="/dist/base.css">
<link rel="stylesheet" href="/dist/components.css">
<style>
  .specimen { display: grid; gap: var(--tl-space-lg); padding: var(--tl-space-xl); max-width: 64rem; margin: 0 auto; }
  .specimen__bar { display: flex; gap: var(--tl-space-sm); align-items: center; }
  .specimen__panel { background: var(--tl-surface-layer); border: var(--tl-border-width-sm) solid var(--tl-border-separator);
    border-radius: var(--tl-radius-md); padding: var(--tl-space-md); display: grid; gap: var(--tl-space-sm); }
  .specimen__base { padding: var(--tl-space-md); display: grid; gap: var(--tl-space-sm); }
  .specimen__row { display: flex; gap: var(--tl-space-sm); flex-wrap: wrap; align-items: center; }
  .specimen__row > .tl-type-label:first-child { min-width: 9rem; color: var(--tl-text-secondary); }
  .specimen__cell { width: 8rem; }
</style>
</head>
<body>
<main class="specimen">
  <div class="specimen__bar">
    <a class="tl-type-label" href="/">← Grundklassen</a>
    <span class="tl-type-heading-lg">Pill</span>
    <label class="tl-type-label"><input type="checkbox" id="mode"> dunkel</label>
    <label class="tl-type-label"><input type="checkbox" id="density"> kompakt</label>
  </div>

  <!-- Jede Zeile: eine Rolle mit Text, mit Icon, und in einer schmalen Zelle abgeschnitten. -->
  <template id="rows">
    <div class="specimen__row">
      <span class="tl-type-label">%NAME%</span>
      <span class="tl-pill %MOD% tl-type-label"><span class="tl-pill__label">%LABEL%</span></span>
      <span class="tl-pill %MOD% tl-type-label"><i class="ri-price-tag-3-line tl-icon-sm tl-pill__icon" aria-hidden="true"></i><span class="tl-pill__label">%LABEL%</span></span>
      <span class="specimen__cell"><span class="tl-pill %MOD% tl-type-label"><span class="tl-pill__label">Ein sehr langer Wert, der nicht passt</span></span></span>
    </div>
  </template>

  <section class="specimen__panel" id="on-layer"><p class="tl-type-heading-sm">Auf surface-layer</p></section>
  <section class="specimen__base" id="on-base"><p class="tl-type-heading-sm">Auf surface-base</p></section>

  <section class="specimen__panel">
    <p class="tl-type-heading-sm">Im Fließtext</p>
    <p class="tl-type-body">Das Ticket steht auf <span class="tl-pill tl-pill--warning"><span class="tl-pill__label">In Arbeit</span></span> und gehört zum Projekt <span class="tl-pill tl-pill--category-6"><span class="tl-pill__label">Nordlicht</span></span>.</p>
  </section>
</main>
<script>
  const VARIANTEN = [
    ['neutral', '', 'Entwurf'], ['brand', 'tl-pill--brand', 'Eigenes'],
    ['error', 'tl-pill--error', 'Abgelehnt'], ['warning', 'tl-pill--warning', 'In Arbeit'], ['success', 'tl-pill--success', 'Erledigt'], ['info', 'tl-pill--info', 'Hinweis'],
    ['category-1', 'tl-pill--category-1', 'Kategorie 1'],
    ['category-2', 'tl-pill--category-2', 'Kategorie 2'],
    ['category-3', 'tl-pill--category-3', 'Kategorie 3'],
    ['category-4', 'tl-pill--category-4', 'Kategorie 4'],
    ['category-5', 'tl-pill--category-5', 'Kategorie 5'],
    ['category-6', 'tl-pill--category-6', 'Kategorie 6'],
    ['category-7', 'tl-pill--category-7', 'Kategorie 7'],
    ['category-8', 'tl-pill--category-8', 'Kategorie 8'],
  ];
  const tpl = document.getElementById('rows').innerHTML;
  for (const id of ['on-layer', 'on-base']) {
    const host = document.getElementById(id);
    for (const [name, mod, label] of VARIANTEN) host.insertAdjacentHTML('beforeend', tpl.replaceAll('%NAME%', name).replaceAll('%MOD%', mod).replaceAll('%LABEL%', label));
  }
  const html = document.documentElement;
  document.getElementById('mode').addEventListener('change', (e) => html.setAttribute('data-tl-mode', e.target.checked ? 'dark' : 'light'));
  document.getElementById('density').addEventListener('change', (e) => html.setAttribute('data-tl-density', e.target.checked ? 'compact' : 'normal'));
</script>
</body>
</html>
