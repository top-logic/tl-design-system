<!doctype html>
<html lang="de" data-tl-mode="light" data-tl-density="normal">
<head>
<meta charset="utf-8">
<title>TopLogic Design System — Toolbar</title>
<link rel="stylesheet" href="/fonts/style/interFonts.css">
<link rel="stylesheet" href="/fonts/style/bootstrap-icons.css">
<link rel="stylesheet" href="/dist/primitives.css">
<link rel="stylesheet" href="/dist/tokens.css">
<link rel="stylesheet" href="/dist/base.css">
<link rel="stylesheet" href="/dist/components.css">
<style>
  .specimen { display: grid; gap: var(--tl-space-lg); padding: var(--tl-space-xl); max-width: 64rem; margin: 0 auto; }
  .specimen__bar { display: flex; gap: var(--tl-space-sm); align-items: center; }
  .specimen__panel { background: var(--tl-surface-layer); border: var(--tl-border-width-sm) solid var(--tl-border-separator);
    border-radius: var(--tl-radius-md); padding: var(--tl-space-md); display: grid; gap: var(--tl-space-sm); }
  .specimen__base { padding: var(--tl-space-md); display: grid; gap: var(--tl-space-sm); }
  .specimen__overlay { background: var(--tl-surface-overlay); box-shadow: var(--tl-shadow-popover);
    border-radius: var(--tl-radius-md); padding: var(--tl-space-md); display: grid; gap: var(--tl-space-sm); }
  .specimen__row { display: grid; grid-template-columns: 12rem minmax(0, 32rem); gap: var(--tl-space-sm); align-items: start; }
  .specimen__row > .tl-type-label:first-child { color: var(--tl-text-secondary); }
</style>
</head>
<body>
<main class="specimen">
  <div class="specimen__bar">
    <a class="tl-type-label" href="/">← Grundklassen</a>
    <span class="tl-type-heading-lg">Toolbar</span>
    <label class="tl-type-label"><input type="checkbox" id="mode"> dunkel</label>
    <label class="tl-type-label"><input type="checkbox" id="density"> kompakt</label>
  </div>

  <!-- Jede Zeile: eine Form, mit Beschriftung. Das Skript setzt die Zeilen auf jede Fläche. -->
  <template id="rows">
    <div class="specimen__row">
      <span class="tl-type-label">Erscheinung primary</span>
      <div class="tl-toolbar" role="toolbar" aria-label="Werkzeuge">
        <div class="tl-toolbar__group"><button type="button" class="tl-button tl-button--primary tl-type-body"><i class="tl-icon-sm bi bi-plus-lg" aria-hidden="true"></i><span class="tl-button__label">Neu</span></button><button type="button" class="tl-button tl-button--primary tl-type-body"><i class="tl-icon-sm bi bi-folder2-open" aria-hidden="true"></i><span class="tl-button__label">Öffnen</span></button></div>
        <div class="tl-divider tl-divider--vertical" role="separator" aria-orientation="vertical"></div>
        <div class="tl-toolbar__group"><button type="button" class="tl-button tl-button--primary tl-type-body"><i class="tl-icon-sm bi bi-trash" aria-hidden="true"></i><span class="tl-button__label">Löschen</span></button></div>
      </div>
    </div>
    <div class="specimen__row">
      <span class="tl-type-label">Erscheinung secondary</span>
      <div class="tl-toolbar" role="toolbar" aria-label="Werkzeuge">
        <div class="tl-toolbar__group"><button type="button" class="tl-button tl-button--secondary tl-type-body"><i class="tl-icon-sm bi bi-plus-lg" aria-hidden="true"></i><span class="tl-button__label">Neu</span></button><button type="button" class="tl-button tl-button--secondary tl-type-body"><i class="tl-icon-sm bi bi-folder2-open" aria-hidden="true"></i><span class="tl-button__label">Öffnen</span></button></div>
        <div class="tl-divider tl-divider--vertical" role="separator" aria-orientation="vertical"></div>
        <div class="tl-toolbar__group"><button type="button" class="tl-button tl-button--secondary tl-type-body"><i class="tl-icon-sm bi bi-trash" aria-hidden="true"></i><span class="tl-button__label">Löschen</span></button></div>
      </div>
    </div>
    <div class="specimen__row">
      <span class="tl-type-label">Erscheinung ghost</span>
      <div class="tl-toolbar" role="toolbar" aria-label="Werkzeuge">
        <div class="tl-toolbar__group"><button type="button" class="tl-button tl-button--ghost tl-type-body"><i class="tl-icon-sm bi bi-plus-lg" aria-hidden="true"></i><span class="tl-button__label">Neu</span></button><button type="button" class="tl-button tl-button--ghost tl-type-body"><i class="tl-icon-sm bi bi-folder2-open" aria-hidden="true"></i><span class="tl-button__label">Öffnen</span></button></div>
        <div class="tl-divider tl-divider--vertical" role="separator" aria-orientation="vertical"></div>
        <div class="tl-toolbar__group"><button type="button" class="tl-button tl-button--ghost tl-type-body"><i class="tl-icon-sm bi bi-trash" aria-hidden="true"></i><span class="tl-button__label">Löschen</span></button></div>
      </div>
    </div>
    <div class="specimen__row">
      <span class="tl-type-label">kompakt (data-tl-compact)</span>
      <div class="tl-toolbar" data-tl-compact role="toolbar" aria-label="Werkzeuge">
        <div class="tl-toolbar__group"><button type="button" class="tl-button tl-button--ghost tl-button--icon" aria-label="Neu" data-tooltip="text:Neu"><i class="tl-icon-md bi bi-plus-lg" aria-hidden="true"></i></button><button type="button" class="tl-button tl-button--ghost tl-button--icon" aria-label="Öffnen" data-tooltip="text:Öffnen"><i class="tl-icon-md bi bi-folder2-open" aria-hidden="true"></i></button></div>
        <div class="tl-divider tl-divider--vertical" role="separator" aria-orientation="vertical"></div>
        <div class="tl-toolbar__group"><button type="button" class="tl-button tl-button--ghost tl-button--icon" aria-label="Löschen" data-tooltip="text:Löschen"><i class="tl-icon-md bi bi-trash" aria-hidden="true"></i></button></div>
      </div>
    </div>
    <div class="specimen__row">
      <span class="tl-type-label">Überlauf (data-tl-overflow)</span>
      <div class="tl-toolbar" data-tl-overflow="trailing" role="toolbar" aria-label="Werkzeuge">
        <div class="tl-toolbar__group"><button type="button" class="tl-button tl-button--ghost tl-type-body"><i class="tl-icon-sm bi bi-plus-lg" aria-hidden="true"></i><span class="tl-button__label">Neu</span></button></div>
        <div class="tl-toolbar__group"><button type="button" class="tl-button tl-button--ghost tl-button--icon" aria-haspopup="menu" aria-expanded="false" aria-label="Weitere Befehle" data-tooltip="text:Weitere Befehle"><i class="tl-icon-md bi bi-three-dots" aria-hidden="true"></i></button></div>
      </div>
    </div>
  </template>

  <section class="specimen__panel" id="on-layer"><p class="tl-type-heading-sm">Auf surface-layer</p></section>
  <section class="specimen__base" id="on-base"><p class="tl-type-heading-sm">Auf surface-base</p></section>
  <section class="specimen__overlay" id="on-overlay"><p class="tl-type-heading-sm">Auf surface-overlay</p></section>
</main>
<script>
  const tpl = document.getElementById('rows');
  for (const id of ['on-layer', 'on-base', 'on-overlay']) {
    const rows = tpl.content.cloneNode(true);
    document.getElementById(id).append(rows);
  }
  const html = document.documentElement;
  document.getElementById('mode').addEventListener('change', (e) => html.setAttribute('data-tl-mode', e.target.checked ? 'dark' : 'light'));
  document.getElementById('density').addEventListener('change', (e) => html.setAttribute('data-tl-density', e.target.checked ? 'compact' : 'normal'));
</script>
</body>
</html>
