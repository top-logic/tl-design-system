<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>TopLogic Specimen</title>
<link rel="stylesheet" href="/style/tlReactBase.css">
<link rel="stylesheet" href="/style/tlReactControls.css">
<!-- Die @font-face-Deklarationen fuer Inter liegen in einem eigenen Modul (ext.com.inter.fonts),
     das keines der beiden obigen Stylesheets einbindet. Ohne diesen Link rendert die Seite in
     einer Ersatzschrift, obwohl "Inter" ueberall referenziert wird. -->
<link rel="stylesheet" href="/interfonts/style/interFonts.css">
<style>
  html, body { height: auto !important; overflow: auto !important; }
  body { margin: 0; font-family: system-ui, sans-serif; }
  .specimenKopf { display: flex; gap: 1rem; align-items: center; padding: .75rem 1rem;
                  border-bottom: 1px solid #8884; position: sticky; top: 0; background: Canvas; }
  .specimenBuehne { padding: 1.5rem; }
  .specimenGate { font: 12px/1.5 ui-monospace, monospace; padding: 1rem;
                  border-top: 1px solid #8884; white-space: pre-wrap; }
  .specimenGate--gruen { color: #0a7; }
  .specimenGate--rot { color: #c33; }

  /* Schriftumschalter: setzt eine Custom Property, die die Buehne liest. Kein Download —
     alle drei Stapel sind entweder jetzt lokal geladen (Inter) oder Systemschriften. */
  .specimenBuehne {
    font-family: var(--specimenSchrift, system-ui, sans-serif);
  }
  .specimenBuehne * {
    font-family: inherit;
  }

  /* Typo-Probe: drei Stufen der Grundschrift ueber eine Custom Property, nicht per
     Inline-Style an den Zellen. Jede Stufe setzt nur --specimenSchriftgroesse; das
     tatsaechliche font-size liegt auf der Tabelle selbst. */
  .specimenTypoStufe { margin-block-end: 2rem; }
  .specimenTypoStufe__titel { font: 600 13px/1.4 system-ui, sans-serif; margin: 0 0 .5rem; }
  .specimenTypoStufe--12 { --specimenSchriftgroesse: 12px; }
  .specimenTypoStufe--13 { --specimenSchriftgroesse: 13px; }
  .specimenTypoStufe--14 { --specimenSchriftgroesse: 14px; }
  .specimenTypoStufe .tlTableView { font-size: var(--specimenSchriftgroesse); }
  .specimenTypoStufe__messung { font: 12px/1.4 ui-monospace, monospace; margin: 0 0 .5rem;
                                 padding: .35rem .6rem; background: #8881; border-radius: 4px;
                                 display: inline-block; }

  /* Zwei Reihen der Typo-Probe: "heute" (Zeilenhoehe bleibt die geerbte Fixhoehe der Tabelle)
     gegen "abgeleitet" (Fixhoehe nur INNERHALB dieser Reihe aufgehoben, damit sich die
     Zeilenhoehe aus font-size + Innenabstand ergibt). Wirkt ausschliesslich im Specimen-eigenen
     Stil, auf keines der beiden Basis-Stylesheets. */
  .specimenTypoReihe { margin-block-end: 2.5rem; }
  .specimenTypoReihe__titel { font: 600 14px/1.4 system-ui, sans-serif; margin: 0 0 1rem;
                               padding-block-end: .4rem; border-bottom: 2px solid #8886; }
  /* height: auto allein reicht nicht: die eigentliche Zwangshöhe kommt nicht von
     .tlTableView__row selbst (dort steht gar kein height), sondern indirekt vom
     "Bearbeiten"-Button in der letzten Spalte (.tlReactButton { height: 2rem }, in rem also
     relativ zur Wurzel-Schriftgröße, nicht zur Tabellen-Schriftgröße) — der Button bleibt bei
     jeder Tabellengröße 32px hoch und zwingt die Zeile im Flex-Layout auf mindestens diese Höhe.
     Um die Ableitung sichtbar zu machen, wird hier zusätzlich der Button (und aus Konsistenz
     die Checkbox) von der rem-Fixgröße befreit und die Zellen bekommen einen von der
     Schriftgröße abhängigen Innenabstand. Wirkt ausschließlich innerhalb dieser Reihe. */
  .specimenTypoStufe--auto .tlTableView__row { height: auto; }
  .specimenTypoStufe--auto .tlTableView__cell {
    padding-block: calc(var(--specimenSchriftgroesse) * .4);
  }
  .specimenTypoStufe--auto .tlReactButton {
    height: auto;
    font-size: inherit;
  }
  .specimenTypoStufe--auto .tlReactCheckbox {
    width: 1em;
    height: 1em;
  }

  /* Sichtbar machen, dass 700 bei Inter kuenstlich (synthetisch) fett gerechnet wird:
     Inter hat nur Regular (400) und SemiBold (deklariert als 700/bold). Ein echtes 700
     gibt es nicht — der Browser skaliert das SemiBold-Outline algorithmisch. */
  .specimenSchriftvergleich { display: flex; gap: 2rem; flex-wrap: wrap; padding: 1rem 1.5rem;
                               border-bottom: 1px solid #8884; font-size: 16px; }
  .specimenSchriftvergleich strong { display: block; font-size: 11px; font-weight: normal;
                                      opacity: .6; margin-bottom: .25rem; }
  .specimenSchriftvergleich span { font-family: var(--specimenSchrift, system-ui, sans-serif); }
  .specimenSchriftvergleich .regular { font-weight: 400; }
  .specimenSchriftvergleich .semibold { font-weight: bold; }   /* Inters echter zweiter Schnitt */
  .specimenSchriftvergleich .synth700 { font-weight: 700; }    /* nur bei Inter = synthetisch */

  /* Marken-Explorer: Regler, Rampen-Ausgabe, erweitertes Gate. Eigener Block, eigene Zeile
     unter dem Kopf — die Umschalter oben bleiben unverändert nutzbar. */
  .specimenMarke { display: flex; gap: 1.5rem; align-items: flex-start; flex-wrap: wrap;
                   padding: .75rem 1rem; border-bottom: 1px solid #8884; font: 13px/1.4 system-ui, sans-serif; }
  .specimenMarke__regler { display: flex; gap: .5rem; align-items: center; }
  .specimenMarke__regler input[type="color"] { width: 2.2rem; height: 2.2rem; padding: 0;
                                                border: 1px solid #8886; border-radius: 4px; }
  .specimenMarke__regler input[type="text"] { font: 13px ui-monospace, monospace; width: 6.5em;
                                               padding: .25rem .4rem; }
  .specimenMarke__rampen { display: flex; gap: 1rem; flex-wrap: wrap; }
  .specimenMarke__rampe { display: flex; flex-direction: column; gap: .15rem; }
  .specimenMarke__rampe strong { font-size: 11px; opacity: .65; }
  .specimenMarke__rampe output { display: flex; gap: .35rem; flex-wrap: wrap; }
  .specimenMarke__schwatch { display: flex; align-items: center; gap: .3rem; font: 11px ui-monospace, monospace; }
  .specimenMarke__farbe { width: 1em; height: 1em; border-radius: 2px; border: 1px solid #8886; display: inline-block; }
  .specimenMarke__hex { user-select: all; cursor: text; }

  /* Drei Zustände einer Rampen-Stufe, klar unterschieden:
     - reduziert: normal, informativ (Chroma gesenkt, um im Gamut zu bleiben) — gedeckte Farbe.
     - geklemmt: Fehlerfall (sollte praktisch nie vorkommen) — Warnfarbe wie kollabiert.
     - kollabiert: der schwerste Fall, zwei Stufen nicht mehr unterscheidbar — kräftigste Farbe. */
  .specimenMarke__schwatch--reduziert .specimenMarke__hex { color: #7a6a00; font-weight: 600; }
  .specimenMarke__hinweis { color: #7a6a00; font: 11px/1.3 system-ui, sans-serif; }
  .specimenMarke__schwatch--geklemmt .specimenMarke__hex { color: #b45; font-weight: 600; }
  .specimenMarke__schwatch--kollabiert .specimenMarke__hex { color: #c11; font-weight: 700; }
  .specimenMarke__warnung { color: #c11; font: 11px/1.3 system-ui, sans-serif; }
  .specimenMarke__schwatch--geklemmt .specimenMarke__warnung { color: #b45; }

  .specimenGate__zeile { padding-block: .1rem; }
  .specimenGate__marke { font-weight: 700; }
  .specimenGate__marke::before { content: "★ "; }
  .specimenGate__kopf { font-weight: 700; margin-block-end: .25rem; }
</style>
</head>
<body>
  <header class="specimenKopf">
    <strong>Specimen</strong>
    <label>Modus
      <select id="modus"><option value="light">hell</option><option value="dark">dunkel</option></select>
    </label>
    <label>Schrift
      <select id="schrift">
        <option value="'Inter', system-ui, sans-serif">Inter</option>
        <option value="system-ui, sans-serif">System (system-ui)</option>
        <option value="'SF Compact Text', system-ui, sans-serif">SF Compact Text (schmal, ziffernsicher)</option>
      </select>
    </label>
    <label>Ansicht
      <select id="ansicht">
        <option value="fragmente">Fragmente (Buttons/Formular/Tabelle)</option>
        <option value="typo">Typo-Probe (12/13/14px)</option>
      </select>
    </label>
    <span id="gateKurz"></span>
  </header>
  <section class="specimenMarke">
    <div class="specimenMarke__regler">
      <label>Markenfarbe
        <input type="color" id="markeFarbe" value="#2968C8">
      </label>
      <input type="text" id="markeHex" value="#2968C8" aria-label="Markenfarbe als Hex" maxlength="7">
      <button type="button" id="markeZuruecksetzen">Zurücksetzen (#2968C8)</button>
    </div>
    <div class="specimenMarke__rampen">
      <div class="specimenMarke__rampe">
        <strong>hell</strong>
        <output id="rampeHell"></output>
      </div>
      <div class="specimenMarke__rampe">
        <strong>dunkel</strong>
        <output id="rampeDunkel"></output>
      </div>
    </div>
  </section>
  <section class="specimenSchriftvergleich">
    <span><strong>Regular (400)</strong><span class="regular">Grundstücksverkehrsgenehmigungsverfahren 0O1l7</span></span>
    <span><strong>SemiBold (deklariert als bold)</strong><span class="semibold">Grundstücksverkehrsgenehmigungsverfahren 0O1l7</span></span>
    <span><strong>font-weight: 700 (bei Inter synthetisch fett)</strong><span class="synth700">Grundstücksverkehrsgenehmigungsverfahren 0O1l7</span></span>
  </section>
  <main class="specimenBuehne" id="buehne"></main>
  <section class="specimenGate" id="gate"></section>
  <script type="module" src="./specimen.mjs"></script>
</body>
</html>
